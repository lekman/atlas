version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.10.8
lint:
  ignore:
    - linters: [ALL]
      paths:
        - "**/CHANGELOG.md"
        # Generated by mise when it installs tools. Not a file we author.
        - ".mise/**"
        - "**/storybook-static/**"
  enabled:
    # ── Quality ───────────────────────────────────────────────────────────
    - oxipng@9.1.5
    - pinact@4.0.0
    - actionlint@1.7.12
    - git-diff-check
    - markdownlint@0.49.1
    - prettier@3.9.6
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - taplo@0.10.0
    - yamllint@1.38.0
    # ── Security ──────────────────────────────────────────────────────────
    # Two secret engines, because they fail differently. gitleaks matches
    # patterns, so it catches a key it cannot check and costs some false
    # positives. trufflehog runs --only-verified, so it calls the provider to
    # confirm a credential is live: no false positives, but quiet on anything
    # it cannot verify.
    - gitleaks@8.29.0
    - trufflehog@3.97.4
    # Known CVEs in dependencies, read straight from bun.lock.
    - osv-scanner@2.5.1
    # Misconfiguration in GitHub Actions workflows.
    - checkov@3.3.16
actions:
  disabled:
    - trunk-announce
  enabled:
    # Deliberately NOT trunk-check-pre-push / trunk-fmt-pre-commit: those take
    # over core.hooksPath and silently disable the husky hooks, which run
    # trunk plus typecheck, tests, story tests and the client-content check.
    - trunk-upgrade-available
