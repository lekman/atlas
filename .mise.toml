[tools]
bun = "1.3"
node = "22"
"aqua:go-task/task" = "3.49"
# Trunk drives lint, format and the security scanners, and both husky hooks
# call it. Pinned here so `mise install` is all a new contributor needs.
trunk = "1.3"
# The pre-push hook scans every commit for secrets, not only the files as
# they stand, which Trunk's gitleaks does.
gitleaks = "8.28"
