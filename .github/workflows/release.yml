# Release Please: opens and updates a release pull request from conventional
# commits; merging it tags the release and writes the changelog.
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # tags and the changelog
      pull-requests: write # the release pull request
    steps:
      # GitHub runs no workflows on a pull request opened with GITHUB_TOKEN, so
      # a release pull request opened that way never gets its required checks
      # and cannot merge. A pull request opened by the GitHub App runs them.
      #
      # continue-on-error so a repository without the App secrets still opens
      # its release pull request with GITHUB_TOKEN.
      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Report which identity is releasing
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "Releasing as the GitHub App."
          else
            echo "::warning::vars.APP_ID or secrets.APP_PRIVATE_KEY is not set, so this releases with GITHUB_TOKEN."
            echo "::warning::Its release pull request gets no checks until a person closes and reopens it."
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release/release-please-config.json
          manifest-file: release/.release-please-manifest.json
