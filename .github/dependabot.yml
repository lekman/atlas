# The bun ecosystem updates package.json and bun.lock together, so CI's
# frozen install accepts Dependabot's pull requests as they are.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: sunday
    commit-message:
      # Conventional prefix so Release Please files these under Fixes.
      prefix: fix(dependabot)
    groups:
      storybook:
        patterns: ["storybook", "@storybook/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      fonts:
        patterns: ["@fontsource/*"]
    ignore:
      # Zod is held at 3.25 on purpose: it ships the v4 API under `zod/v4`
      # while staying the version the MCP SDK resolves for its own types.
      # See .claude/rules/stack.md. Minors and patches still flow.
      - dependency-name: zod
        update-types: ["version-update:semver-major"]
      # TypeScript is held at 6: .claude/rules/stack.md names TypeScript 6,
      # and 7 is a move to decide on, not a weekly bump. Minors and patches
      # still flow.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    groups:
      # One pull request for all actions: the churn is what gets them ignored.
      all-actions:
        patterns: ["*"]
    commit-message:
      prefix: fix(dependabot)
